[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tkn-genai-chat-note-pipeline"
version = "0.48.0"
description = "Read archived generative AI chat logs and prepare source-cited proposals for existing notes."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tuckn" }]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "Jinja2>=3.1,<4",
  "tkn-genai-bridge @ https://github.com/tuckn/tkn_genai_bridge/archive/9cf534e47159901c3bb05bb802695fad746cc338.zip",
  "tkn-genai-chat-archiver",
  "tkn-genai-chat-search",
  "httpx>=0.28,<1",
  "tiktoken>=0.12,<1",
  "zstandard>=0.23,<1",
]

[project.scripts]
tkn-genai-chat-note = "tkn_genai_chat_note.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tkn_genai_chat_note"]

[tool.hatch.metadata]
allow-direct-references = true

# TODO(before commit): pin both to a pushed commit, like tkn-genai-bridge above.
[tool.uv.sources]
tkn-genai-chat-archiver = { path = "../tkn_genai_chat_archiver", editable = true }
tkn-genai-chat-search = { path = "../tkn_genai_chat_search", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tkn_genai_chat_note"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "zstandard"
ignore_missing_imports = true
