schema_version: "8.4.0"
# One shared cache base; codex/source_id partitions are automatic.
cache_root: ~/.cache/codex_chat_note_pipeline

# Every source is a local Codex directory. Map keys are stable source_id values.
# Recommended: lowercase ASCII kebab-case, e.g. laptop-windows or laptop-wsl-ubuntu.
# Allowed: ASCII letters/digits/._-, starting with a letter/digit. No spaces or Unicode.
# No trailing dot, Windows reserved names, or case-only duplicate IDs.
sources:
  my-windows-note-pc:
    enabled: true
    source_root: ~/.codex
    include_archived: true

    # Optional final directories; no codex/source_id suffix is added.
    # Omit roots for ~/.tkn/codex_chat_note_pipeline/<kind>/codex/<source_id>.
    # When upgrading, explicitly retain the old final raw/data/state paths.
    raw_root: C:/path/to/codex/raw
    data_root: C:/path/to/codex/data
    state_root: C:/path/to/codex/state
  my-wsl-ubuntu:
    enabled: false
    source_root: '//wsl$/Ubuntu/home/<user>/.codex'
    include_archived: true

generation:
  # Inference is independent of the Codex acquisition sources.
  # Built-in profiles only: default-jp (Japanese) or default-en (English).
  session_note_profile: default-jp

  # Connection/model/authentication are managed in ~/.tkn/genai_bridge/config.yaml.
  # Choose a local application profile with --profile <name>.
  active_profile: codex
  profiles:
    codex:
      bridge_profile: codex-default

    # Define azure-notes in Bridge before enabling this application profile.
    # azure:
    #   bridge_profile: azure-notes
    #   # Set pricing in the shared Bridge profile (currency: JPY).
    #   limits:
    #     input_tokens: 60000
    #     output_tokens: 16000
    #     context_tokens: 100000
    #     chunk_characters: 120000
    #     max_calls: 30
    #     max_cost_jpy: 100
idle_minutes: 30
runtime_minutes: 230
model_timeout_seconds: 1800

# Calendar reviews across all enabled sources (independent of token usage reports).
reviews:
  data_root: ~/.tkn/codex_chat_note_pipeline/data/reviews
  state_root: ~/.tkn/codex_chat_note_pipeline/state/reviews
  language: ja  # ja or en; one content contract
  utc_offset_minutes: 540  # Fixed UTC offset; 540 = Japan. No daylight-saving adjustment.
  start_date: null  # due starts with periods containing its first actual run; set a date to backfill.
  max_calls: 12  # One review command; includes Raw checks and merges. Cached stages do not count.
  session_note_limit: 10  # Maximum Session Note generations in one scheduled-run, before reviews.
  input_characters: 50000  # Per-call prompt ceiling; large periods are batched.
  raw_characters: 16000  # Maximum original text returned per batch's Raw check.
  raw_requests: 8  # Maximum evidence IDs requested per batch; 0 disables Raw drill-down.

# Offline usage reports; no inference or price lookup occurs during build-report.
report_path: ~/.tkn/codex_chat_note_pipeline/reports
usage_report:
  utc_offset_minutes: 0  # Use 540 for Japan; execution dates, not original chat dates.
  price_scenarios: {}
  # Reference cost for the same token counts; not an invoice or model prediction.
  # Reference confirmed rates in the shared Bridge profile, for example:
  # price_scenarios:
  #   comparison-model:
  #     bridge_profile: azure-notes
  #     model: <deployment-name>
